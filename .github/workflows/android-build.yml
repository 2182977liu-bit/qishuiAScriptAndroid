name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native-android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build offline and lite debug APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QishuiAutomationApp-debug
          path: |
            native-android/app/build/outputs/apk/offline/debug/app-offline-debug.apk
            native-android/app/build/outputs/apk/lite/debug/app-lite-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: 汽水自动助手 v0.2.0
          body: |
            ## 汽水自动助手 0.2.0

            - 悬浮窗支持拖动、最大化/最小化和实时日志
            - Offline 版内置中文 OCR 模型，不依赖 Google Play 服务
            - Lite 版由 Google Play 服务按需下载 OCR 模型
            - 仅支持 arm64 手机、Android 8.0 及以上

            当前附件为 Debug 测试包，使用调试签名，仅用于安装测试。
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            native-android/app/build/outputs/apk/offline/debug/app-offline-debug.apk
            native-android/app/build/outputs/apk/lite/debug/app-lite-debug.apk
